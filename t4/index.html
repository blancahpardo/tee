<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 4 · La escritura académica — TEE</title>
<style>
  :root {
    --azul: #003B5C;
    --azul-d: #00283F;
    --amar: #F4C542;
    --gris: #34484F;
    --claro: #F3F3F4;
    --humo: #9FB1BA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #FFFFFF;
    color: var(--gris);
  }
  a { color: inherit; }

  #gate {
    position: fixed; inset: 0; background: var(--azul);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 999;
  }
  #gate .box { max-width: 380px; width: 100%; text-align: center; }
  #gate .kicker {
    color: var(--amar); font-size: 12px; font-weight: bold;
    letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 10px;
  }
  #gate h1 { color: #FFFFFF; font-size: 26px; margin: 0 0 10px; }
  #gate p { color: var(--humo); font-size: 14px; margin: 0 0 26px; }
  #gate input {
    width: 100%; padding: 13px 16px; border-radius: 8px; border: none;
    font-size: 15px; font-family: Arial, Helvetica, sans-serif;
    margin-bottom: 14px; outline: 2px solid transparent;
  }
  #gate input:focus { outline: 2px solid var(--amar); }
  #gate button.submit {
    width: 100%; padding: 13px 16px; border-radius: 8px; border: none;
    background: var(--amar); color: var(--azul-d); font-size: 15px; font-weight: bold;
    font-family: Arial, Helvetica, sans-serif; cursor: pointer;
  }
  #gate button.submit:hover { filter: brightness(1.06); }
  #gate .error { color: #FFB3B3; font-size: 13px; margin-top: 12px; min-height: 18px; }

  #page { display: none; }
  main { max-width: 980px; margin: 0 auto; padding: 48px 6vw 60px; }

  .kicker {
    color: var(--amar); font-size: 12px; font-weight: bold;
    letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 8px;
  }
  .view > h1 { color: var(--azul); font-size: 32px; margin: 0 0 34px; }

  .hub-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px; margin-bottom: 30px;
  }
  .hub-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    background: var(--claro); border: none; border-radius: 12px; padding: 26px 22px;
    cursor: pointer; text-align: left; box-shadow: 0 2px 10px rgba(159,177,186,0.28);
    font-family: Arial, Helvetica, sans-serif;
  }
  .hub-btn:hover { background: #E9ECEE; }
  .hub-icon { font-size: 30px; margin-bottom: 4px; }
  .hub-label { font-size: 17px; font-weight: bold; color: var(--azul); }
  .hub-desc { font-size: 12.5px; color: var(--humo); }
  .hub-disclaimer { font-size: 11px; color: var(--humo); font-style: italic; margin-top: 2px; }

  .back-home { font-size: 13px; color: var(--humo); text-decoration: none; }
  .back-home:hover { color: var(--azul); }

  .sub-view h2 { color: var(--azul); font-size: 24px; margin: 18px 0 4px; }
  .sub-view .section-note { font-size: 13px; color: var(--humo); margin: 0 0 24px; }
  .back-btn {
    background: none; border: 1.5px solid var(--azul); color: var(--azul);
    font-size: 13px; font-weight: bold; padding: 6px 14px; border-radius: 20px;
    cursor: pointer; font-family: Arial, Helvetica, sans-serif;
  }
  .back-btn:hover { background: var(--azul); color: #FFFFFF; }

  .dl-big {
    display: inline-block; background: var(--amar); color: var(--azul-d);
    font-weight: bold; font-size: 14px; text-decoration: none;
    padding: 10px 20px; border-radius: 20px; margin-bottom: 18px;
  }
  .pdf-frame, .office-frame, .resource-frame {
    width: 100%; height: 78vh; border: none; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(159,177,186,0.28);
  }

  .mini-gate {
    max-width: 360px; background: var(--claro); border-radius: 12px;
    padding: 26px; margin-top: 10px;
  }
  .mini-gate p { font-size: 13px; color: var(--gris); margin: 0 0 16px; }
  .mini-gate input {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: 1.5px solid var(--humo);
    font-size: 14px; font-family: Arial, Helvetica, sans-serif; margin-bottom: 12px;
  }
  .mini-gate button.submit {
    padding: 10px 20px; border-radius: 20px; border: none;
    background: var(--azul); color: #FFFFFF; font-size: 13px; font-weight: bold;
    font-family: Arial, Helvetica, sans-serif; cursor: pointer;
  }
  .mini-gate button.submit:hover { filter: brightness(1.15); }
  .mini-gate .error { color: #B00020; font-size: 12px; margin-top: 10px; min-height: 16px; }

  section + section { margin-top: 46px; }
  section h2.serie-title { color: var(--azul); font-size: 22px; margin: 0 0 4px; }
  .video-card {
    background: var(--claro); border-radius: 10px; padding: 20px; margin-bottom: 22px;
    box-shadow: 0 2px 10px rgba(159, 177, 186, 0.28);
  }
  .video-card .meta {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 12px; flex-wrap: wrap; gap: 6px;
  }
  .video-card h3 { margin: 0; color: var(--azul); font-size: 17px; }
  .video-card .badges { display: flex; align-items: center; gap: 8px; }
  .video-card .badge {
    background: var(--azul); color: var(--amar); font-size: 11px; font-weight: bold;
    letter-spacing: 1px; padding: 4px 10px; border-radius: 20px; white-space: nowrap;
  }
  .video-card .dl {
    font-size: 11px; font-weight: bold; color: var(--azul); text-decoration: none;
    border: 1.5px solid var(--azul); padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .video-card .dl:hover { background: var(--azul); color: #FFFFFF; }
  video {
    width: 100%; max-height: 62vh; display: block; border-radius: 6px;
    background: #000; outline: none;
  }

  footer {
    text-align: center; padding: 26px 6vw 40px; font-size: 11px;
    color: var(--humo); font-style: italic;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="kicker">Tema 4 · La escritura académica</div>
    <h1>TEE</h1>
    <p>Contenido protegido. Introduce la contraseña facilitada en clase / Moodle.</p>
    <input type="password" id="pw" placeholder="Contraseña" autofocus>
    <button class="submit" id="enter">Acceder</button>
    <div class="error" id="err"></div>
  </div>
</div>

<div id="page">
  <main id="content"></main>
  <footer>
    © Dra. Blanca Hernández Pardo · Técnicas y estrategias de comunicación escrita en español · Universidad Pontificia Comillas
  </footer>
</div>

  function sha256Hex(text) {
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", enc).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach(function(v) { v.hidden = true; });
    var el = document.getElementById(id) || document.getElementById("view-" + id);
    if (el) el.hidden = false;
  }

  function wireNav() {
    document.querySelectorAll(".hub-btn").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.view); });
    });
    document.querySelectorAll("[data-back]").forEach(function(btn) {
      btn.addEventListener("click", function() { showView(btn.dataset.back); });
    });
    document.querySelectorAll("[data-mini-unlock]").forEach(function(btn) {
      var rid = btn.dataset.miniUnlock;
      var cfg = RESOURCES[rid];
      function tryMini() {
        var val = document.getElementById("res-" + rid + "-pw").value;
        sha256Hex(val).then(function(hex) {
          if (hex === cfg.hash) {
            document.getElementById("res-" + rid + "-gate").hidden = true;
            if (cfg.kind === "external") {
              window.location.href = cfg.target;
            } else {
              var frame = document.getElementById("res-" + rid + "-frame");
              frame.src = cfg.target;
              frame.hidden = false;
            }
          } else {
            document.getElementById("res-" + rid + "-err").textContent = "Contraseña incorrecta.";
          }
        });
      }
      btn.addEventListener("click", tryMini);
      document.getElementById("res-" + rid + "-pw").addEventListener("keydown", function(e) {
        if (e.key === "Enter") tryMini();
      });
    });
  }

  function reveal() {
    document.getElementById("content").innerHTML =
      decodeURIComponent(escape(atob(PAYLOAD)));
    RESOURCES = JSON.parse(decodeURIComponent(escape(atob(RESOURCES_PAYLOAD))));
    document.getElementById("gate").style.display = "none";
    document.getElementById("page").style.display = "block";
    wireNav();
    try { sessionStorage.setItem("t4_unlocked", "1"); } catch (e) {}
  }

  function tryUnlock() {
    var val = document.getElementById("pw").value;
    sha256Hex(val).then(function(hex) {
      if (hex === HASH) {
        reveal();
      } else {
        document.getElementById("err").textContent = "Contraseña incorrecta.";
      }
    });
  }
